services:
  - type: web
    name: fake-news-detector
    env: python
    plan: free
    runtime: python
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    pythonVersion: 3.10.13
